name: Campnect CI & Quality Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Typecheck, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Enable Corepack & Install pnpm
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Run Navigation State Machine Test Suite (108 Tests)
        run: pnpm run test:navigation

      - name: Run Demo Server & Storage Test Suites
        run: |
          pnpm run test:demo:server
          pnpm run test:demo

      - name: Validate TypeScript Contracts
        run: pnpm run typecheck:libs
