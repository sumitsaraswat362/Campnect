<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="512x512" href="/campnect-logo.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <!-- Native Android uses a measured safe frame instead of edge-to-edge
         viewport CSS, which varies across WebView and phone versions. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Native / PWA chrome -->
    <meta name="theme-color" content="#000000" />
    <meta name="application-name" content="Campnect" />
    <meta name="description" content="Connect with your campus community on Campnect." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Campnect" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />

    <title>Campnect</title>
    <!-- Google Fonts: Plus Jakarta Sans (headings) + Inter (body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <script>
      // Custom domains are routed to the project root before artifact
      // path handling. Send the Legal hostname to its dedicated artifact while
      // preserving direct links, query parameters, and hash fragments.
      if (
        window.location.hostname.toLowerCase() === 'legal-campnect.perinol.com' &&
        !window.location.pathname.startsWith('/campnect-legal/')
      ) {
        window.location.replace(
          `/campnect-legal${window.location.pathname}${window.location.search}${window.location.hash}`,
        )
      }
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
